        - Push default
        trigger: true
    timeout: 2h
  - attempts: 2
    no_get: true
    params:
      credentials: ((gcp:halfpipe-team-katee-halfpipe-team/token.token))
      eaid: APPL-437
      gitRefPath: git/.git/ref
      vars:
        ENV1: "1234"
        ENV2: ((secret.something))
        ENV3: '{"a": "b", "c": "d"}'
        ENV4: ((another.secret))
        LONG_SECRET: ((path/to/map.key))
        VERY_SECRET: ((another.secret))
      velafile: git/.e2e/deploy-katee/vela.yaml
