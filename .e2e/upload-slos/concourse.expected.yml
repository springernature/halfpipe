# Generated using halfpipe cli version 0.0.0-DEV from file .e2e/upload-slos/.halfpipe.io.yml for team halfpipe-team
jobs:
- build_log_retention:
    minimum_succeeded_builds: 1
  name: update
  plan:
  - attempts: 2
    get: git
    timeout: 2h
    trigger: true
  - attempts: 2
    config:
      image_resource:
        name: ""
        source:
          password: ((gcp:platform-gar/token.token))
          registry_mirror:
            host: eu-mirror.gcr.io
          repository: eu.gcr.io/halfpipe-io/halfpipe-auto-update
          tag: latest
          username: oauth2accesstoken
        type: registry-image
      inputs:
      - name: git
      params:
        CONCOURSE_PASSWORD: ((platform/concourse.password))
        CONCOURSE_TEAM: ((platform/concourse.team))
        CONCOURSE_URL: ((platform/concourse.url))
        CONCOURSE_USERNAME: ((platform/concourse.username))
        HALFPIPE_DOMAIN: halfpipe.io
        HALFPIPE_FILE_PATH: .halfpipe.io.yml
        HALFPIPE_PROJECT: halfpipe-io
        PIPELINE_NAME: halfpipe-e2e-upload-slos
      platform: linux
      run:
        dir: git/.e2e/upload-slos
        path: update-pipeline
    task: update
    timeout: 2h
  - attempts: 2
    no_get: true
    params:
      bump: minor
    put: version
    timeout: 2h
  serial: true
- build_log_retention:
    minimum_succeeded_builds: 1
  name: ""
  plan:
  - attempts: 2
    in_parallel:
      fail_fast: true
      steps:
      - get: git
        passed:
        - update
      - get: version
        passed:
        - update
        trigger: true
    timeout: 2h
- build_log_retention:
    minimum_succeeded_builds: 1
  name: ""
  plan:
  - attempts: 2
    in_parallel:
      fail_fast: true
      steps:
      - get: git
        passed:
        - upload-slos
      - get: version
        passed:
        - upload-slos
        trigger: true
    timeout: 2h
resources:
- check_every: 10m0s
  name: git
  source:
    branch: main
    paths:
    - .e2e/upload-slos
    private_key: ((halfpipe-github.private_key))
    uri: git@github.com:springernature/halfpipe
  type: git
- check_every: 24h0m0s
  name: version
  source:
    bucket: ((halfpipe-semver.bucket))
    driver: gcs
    json_key: ((halfpipe-semver.private_key))
    key: halfpipe-team-halfpipe-e2e-upload-slos
  type: semver
var_sources:
- config:
    auth_backend: approle
    auth_params:
      role_id: ((platform/team-ro-app-role.vault_approle_id))
      secret_id: ((platform/team-ro-app-role.vault_approle_secret_id))
    lookup_templates:
    - '{{.Secret}}'
    path_prefix: gcp/impersonated-account/
    url: ((platform/team-ro-app-role.vault_addr))
  name: gcp
  type: vault
