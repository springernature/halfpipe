# Generated using halfpipe cli version 0.0.0-DEV from file .e2e/observability-provisioning/.halfpipe.io.yml for team halfpipe-team
jobs:
- build_log_retention:
    minimum_succeeded_builds: 1
  name: update
  plan:
  - attempts: 2
    get: git
    timeout: 2h
    trigger: true
  - attempts: 2
    config:
      image_resource:
        name: ""
        source:
          password: ((gcp:platform-gar/token.token))
          registry_mirror:
            host: eu-mirror.gcr.io
          repository: eu.gcr.io/halfpipe-io/halfpipe-auto-update
          tag: latest
          username: oauth2accesstoken
        type: registry-image
      inputs:
      - name: git
      params:
        CONCOURSE_PASSWORD: ((platform/concourse.password))
        CONCOURSE_TEAM: ((platform/concourse.team))
        CONCOURSE_URL: ((platform/concourse.url))
        CONCOURSE_USERNAME: ((platform/concourse.username))
        HALFPIPE_DOMAIN: halfpipe.io
        HALFPIPE_FILE_PATH: .halfpipe.io.yml
        HALFPIPE_PROJECT: halfpipe-io
        PIPELINE_NAME: halfpipe-e2e-observability-provisioning
      platform: linux
      run:
        dir: git/.e2e/observability-provisioning
        path: update-pipeline
    task: update
    timeout: 2h
  - attempts: 2
    no_get: true
    params:
      bump: minor
    put: version
    timeout: 2h
  serial: true
- build_log_retention:
    minimum_succeeded_builds: 1
  name: observability-provisioning
  plan:
  - attempts: 2
    in_parallel:
      fail_fast: true
      steps:
      - get: git
        passed:
        - update
      - get: version
        passed:
        - update
        trigger: true
    timeout: 2h
  - config:
      caches:
      - path: ../../../var/halfpipe/cache
      - path: ../../../halfpipe-cache
      image_resource:
        name: ""
        source:
          password: ((gcp:platform-gar/token.token))
          registry_mirror:
            host: eu-mirror.gcr.io
          repository: eu.gcr.io/halfpipe-io/engineering-enablement/o11ytool
          tag: latest
          username: oauth2accesstoken
        type: registry-image
      inputs:
      - name: git
      - name: version
      platform: linux
      run:
        args:
        - -c
        - |
          if ! which bash > /dev/null && [ "$SUPPRESS_BASH_WARNING" != "true" ]; then
            echo "WARNING: Bash is not present in the docker image"
            echo "If your script depends on bash you will get a strange error message like:"
            echo "  sh: yourscript.sh: command not found"
            echo "To fix, make sure your docker image contains bash!"
            echo "Or if you are sure you don't need bash you can suppress this warning by setting the environment variable \"SUPPRESS_BASH_WARNING\" to \"true\"."
            echo ""
            echo ""
          fi

          if [ -e /etc/alpine-release ]
          then
            echo "WARNING: you are running your build in an Alpine based image"
            echo "There is a known issue where DNS resolving does not work as expected"
            echo "https://github.com/gliderlabs/docker-alpine/issues/255"
            echo "If you see any errors related to resolving hostnames the best course of action is to switch to another image"
            echo "we recommend debian as an alternative"
            echo ""
            echo ""
          fi

          export GIT_REVISION=`cat ../../.git/ref`
          export BUILD_VERSION=`cat ../../../version/version`

          \upload-slos -i slos && \sync-metric-rules -i alerts
          EXIT_STATUS=$?
          if [ $EXIT_STATUS != 0 ] ; then
            exit 1
          fi
        dir: git/.e2e/observability-provisioning
        path: /bin/sh
    task: observability-provisioning
    timeout: ""
  serial: true
resources:
- check_every: 10m0s
  name: git
  source:
    branch: main
    paths:
    - .e2e/observability-provisioning
    private_key: ((halfpipe-github.private_key))
    uri: git@github.com:springernature/halfpipe
  type: git
- check_every: 24h0m0s
  name: version
  source:
    bucket: ((halfpipe-semver.bucket))
    driver: gcs
    json_key: ((halfpipe-semver.private_key))
    key: halfpipe-team-halfpipe-e2e-observability-provisioning
  type: semver
var_sources:
- config:
    auth_backend: approle
    auth_params:
      role_id: ((platform/team-ro-app-role.vault_approle_id))
      secret_id: ((platform/team-ro-app-role.vault_approle_secret_id))
    lookup_templates:
    - '{{.Secret}}'
    path_prefix: gcp/impersonated-account/
    url: ((platform/team-ro-app-role.vault_addr))
  name: gcp
  type: vault
