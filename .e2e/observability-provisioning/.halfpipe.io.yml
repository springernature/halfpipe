# yaml-language-server: $schema=../../.generated/schema.json
team: halfpipe-team
pipeline: halfpipe-e2e-observability-provisioning

feature_toggles:
- disable-automatic-notifications

triggers:
- type: git
  branch: main
  watched_paths:
  - .e2e/observability-provisioning

tasks:
- type: observability-provisioning
  name: "opted into everything"
  slos: slos
  metric_rules: metric_rules
  alertmanager: alertmanager
- type: observability-provisioning
  name: "only opted into slos"
  slos: slos
- type: observability-provisioning
  name: "only opted into metric_rules"
  metric_rules: metric_rules
- type: observability-provisioning
  name: "only opted into alertmanager"
  alertmanager: alertmanager
