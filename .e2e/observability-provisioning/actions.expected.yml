      with:
        lfs: true
        show-progress: false
        submodules: recursive
        token: ${{ steps.app-token.outputs.token }}
    - name: opted into everything
      id: opted-into-everything
      uses: docker://eu.gcr.io/halfpipe-io/engineering-enablement/o11ytool:latest
      with:
        args: -c "cd .e2e/observability-provisioning; \provisioning --slos slos --metric-rules metric_rules --alertmanager alertmanager --dashboards dashboards"
        entrypoint: /bin/sh
      env:
        CI: "true"
        EAID: APPL-437
        EE_GIT_REPO: https://github.com/springernature/halfpipe
        EE_PLATFORM_TEAM: halfpipe-team
        GRAFANA_ORG_ID: ${{ steps.secrets.outputs.springernature_data_halfpipe-team_platform_central-grafana_grafana_org_id }}
        GRAFANA_TOKEN: ${{ steps.secrets.outputs.springernature_data_halfpipe-team_platform_central-grafana_sa_auth }}
        RUNNING_IN_CI: "true"
    - name: Notify teams (failure)
      if: failure()
      uses: springernature/ee-action-ms-teams@v1
      with:
        platform-team: halfpipe-team
        style: attention
        summary: ❌ GitHub Actions workflow failed
